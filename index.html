<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Kartu Ucapan Duka Cita</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 15px;
      color: #1b4332;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    /* Container Preview Gambar dibuat lebih tinggi & lega */
    .preview-box {
      margin-top: 20px;
      width: 100%;
      min-height: 420px;
      background-color: #eaeaea;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #ddd;
    }

    .preview-box img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      color: white;
    }

    .btn-generate { background-color: #2d6a4f; }
    .btn-download { background-color: #007bff; }
  </style>
</head>
<body>

<div class="container">
  <h2>Form Kartu Duka Cita</h2>
  
  <div class="form-group">
    <label>Nama Almarhum / Almarhumah:</label>
    <input type="text" id="inputAlmarhum" value="Alm. Ibu Sutimi">
  </div>
  
  <div class="form-group">
    <label>Nama Ayah (Bpk):</label>
    <input type="text" id="inputAyah" value="Sukardi">
  </div>

  <div class="form-group">
    <label>Nama Ibu:</label>
    <input type="text" id="inputIbu" value="Aisyah">
  </div>

  <div class="form-group">
    <label>Alamat / Blok Rumah:</label>
    <input type="text" id="inputAlamat" value="Blok A2 No. 15">
  </div>

  <div class="btn-group">
    <button class="btn-generate" onclick="updateCard()">Update Gambar</button>
    <button class="btn-download" onclick="downloadCard()">Download Gambar</button>
  </div>

  <!-- Area Preview Gambar -->
  <div class="preview-box">
    <img id="cardPreview" alt="Preview Kartu Duka Cita">
  </div>
</div>

<script>
function generateDukaCitaCard(data) {
  const canvas = document.createElement('canvas');
  // 1. Ketinggian Canvas ditingkatkan dari 800px ke 980px agar area bawah lega
  canvas.width = 1200;
  canvas.height = 980;

  const ctx = canvas.getContext('2d');
  const centerX = canvas.width / 2;

  // --- BACKGROUND ---
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Bingkai Luar Halus
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 10;
  ctx.strokeRect(15, 15, canvas.width - 30, canvas.height - 30);

  // --- HEADER: PITA HIJAU "TURUT BERDUKA CITA" ---
  ctx.fillStyle = '#1b4332';
  ctx.beginPath();
  ctx.moveTo(120, 70);
  ctx.lineTo(1080, 70);
  ctx.lineTo(1020, 155);
  ctx.lineTo(180, 155);
  ctx.closePath();
  ctx.fill();

  // Teks Header "TURUT BERDUKA CITA"
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 54px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('TURUT BERDUKA CITA', centerX, 130);

  // Sub-header "ATAS MENINGGALNYA"
  ctx.fillStyle = '#2d6a4f';
  ctx.font = 'bold 32px Arial, sans-serif';
  ctx.fillText('- ATAS MENINGGALNYA -', centerX, 215);

  // --- AREA LINGKARAN EMAS (FOTO / NAMA ALMARHUM) ---
  const centerY = 375;
  const radius = 135;

  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI, false);
  ctx.lineWidth = 14;
  ctx.strokeStyle = '#d4af37';
  ctx.stroke();

  // Nama Almarhum/Almarhumah (DIPERBESAR)
  ctx.fillStyle = '#111827';
  ctx.font = 'bold 52px Arial, sans-serif';
  ctx.fillText(data.namaAlmarhum || 'Alm. Ibu Sutimi', centerX, centerY + 18);

  // --- AREA PITA EMAS (ORANG TUA & ALAMAT - DIPERBESAR & DIPERBANYAK RUANG) ---
  const ribbonY = 560;
  const ribbonWidth = 920;
  const ribbonHeight = 160; // Dipertinggi agar teks 2 baris muat & jelas

  // Background Pita Emas
  ctx.fillStyle = '#d4af37';
  ctx.fillRect(centerX - (ribbonWidth / 2), ribbonY, ribbonWidth, ribbonHeight);

  // Border Pita Emas
  ctx.strokeStyle = '#b38f2a';
  ctx.lineWidth = 4;
  ctx.strokeRect(centerX - (ribbonWidth / 2), ribbonY, ribbonWidth, ribbonHeight);

  // Baris 1: Teks Orang Tua (DIPERBESAR ke 36px Bold)
  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 36px Arial, sans-serif';
  const teksOrangTua = `Orang Tua dari Bpk ${data.namaAyah || 'Sukardi'} & Ibu ${data.namaIbu || 'Aisyah'}`;
  ctx.fillText(teksOrangTua, centerX, ribbonY + 62);

  // Baris 2: Alamat / Blok Rumah (DIPERBESAR ke 32px Bold)
  ctx.font = 'bold 32px Arial, sans-serif';
  ctx.fillStyle = '#1e293b';
  const teksAlamat = `(${data.alamat || 'Blok A2 No. 15'} Oleana Park)`;
  ctx.fillText(teksAlamat, centerX, ribbonY + 118);

  // --- FOOTER / PENGURUS RT (HIJAU TUA) ---
  const footerY = 770;
  const footerHeight = 150;

  ctx.fillStyle = '#1b4332';
  ctx.fillRect(50, footerY, canvas.width - 100, footerHeight);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 40px Arial, sans-serif';
  ctx.fillText('KETUA RT05', centerX, footerY + 60);

  ctx.font = 'bold 34px Arial, sans-serif';
  ctx.fillText('& JAJARAN PENGURUS RT05 RW18', centerX, footerY + 115);

  return canvas.toDataURL('image/png');
}

// Fungsi untuk memperbarui preview
function updateCard() {
  const data = {
    namaAlmarhum: document.getElementById('inputAlmarhum').value,
    namaAyah: document.getElementById('inputAyah').value,
    namaIbu: document.getElementById('inputIbu').value,
    alamat: document.getElementById('inputAlamat').value
  };

  const imgBase64 = generateDukaCitaCard(data);
  document.getElementById('cardPreview').src = imgBase64;
}

// Fungsi Download Gambar
function downloadCard() {
  const imgSrc = document.getElementById('cardPreview').src;
  if (!imgSrc) return;

  const link = document.createElement('a');
  link.download = 'Ucapan_Duka_Cita_RT05.png';
  link.href = imgSrc;
  link.click();
}

// Jalankan otomatis saat halaman pertama kali dimuat
window.onload = updateCard;
</script>

</body>
</html>
